name: docker build and push pipeline
on:
  push:
    branches:
      - main
    paths:
      - "ticktra-flask/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ticktra-flask

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} ./ticktra-flask

      - name: Test Docker image
        run: |
          docker run -d --name smoke-test -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "App is responding"
              exit 0
            fi
            sleep 3
          done
          echo "App did not respond on port 8000"
          docker logs smoke-test
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore


      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ARM_CLIENT_ID }}
          password: ${{ secrets.ARM_CLIENT_SECRET }}

      - name: Tag Docker Image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker Image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in Git
        run: |
          sed -i "s|image: .*ticktra-flask:.*|image: ticktraregistry1.azurecr.io/ticktra-flask:${{ github.sha }}|" k8s/app/deployment.yml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "Deploy ticktra-flask ${{ github.sha }}"
          git pull --rebase
          git push
