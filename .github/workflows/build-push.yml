name: docker build and push pipeline
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker Image
        run: docker build -t ticktra-flask . 
      
      - name: Test Docker image
        run: docker run -d ticktra-flask

      - name: Login to ACR
        uses: azure/docker-Login@v2
        with:
          login-server: ticktra.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag Docker Image
        run: docker tag ticktra-flask ${{ secrets.ACR_LOGIN_SERVER }}/ticktra-flask:latest

      - name: Push Docker Image to ACR
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/ticktra-flask:latest


    
