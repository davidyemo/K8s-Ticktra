// ── SCREEN 2: AUTH ─────────────────────────────────────────────────────────────
function Auth({defaultTab, goToApp, goToLanding}) {
  const [tab, setTab] = React.useState(defaultTab || 'signup');
  const [form, setForm] = React.useState({name:'',email:'',company:'',password:''});
  const [errors, setErrors] = React.useState({});

  const validate = () => {
    const e = {};
    if(tab==='signup' && !form.name) e.name = 'Required';
    if(!form.email || !form.email.includes('@')) e.email = 'Valid email required';
    if(!form.password || form.password.length < 6) e.password = 'Min 6 characters';
    return e;
  };
  const [submitting, setSubmitting] = React.useState(false);

  const handleSubmit = () => {
    const e = validate();
    if(Object.keys(e).length > 0){ setErrors(e); return; }
    setSubmitting(true);
    const endpoint = tab === 'signup' ? '/api/auth/signup' : '/api/auth/login';
    api(endpoint, { method: 'POST', body: form })
      .then(() => goToApp())
      .catch(err => setErrors({ email: err.message }))
      .finally(() => setSubmitting(false));
  };
  const onEnter = (e) => { if(e.key==='Enter') handleSubmit(); };

  return (
    <div className="auth">
      <aside className="auth-aside">
        <div style={{display:'flex',alignItems:'center',gap:11,cursor:'pointer'}} onClick={goToLanding}>
          <Logo/><span className="logo-text">Ticktra</span>
        </div>
        <div className="auth-scene">
          <div className="auth-stack">
            <div className="auth-card3d" style={{top:0,'--z':'0px'}}>
              <div className="t"><span>Access request — SharePoint</span><span className="badge badge-open">Open</span></div>
              <div className="s">Routed to approver · 2m ago</div>
            </div>
            <div className="auth-card3d" style={{top:115,'--z':'50px',animationDelay:'-2s'}}>
              <div className="t"><span>Account unlock — Outlook</span><span className="badge badge-resolved">Resolved</span></div>
              <div className="s">Handled automatically in 11s</div>
            </div>
            <div className="auth-card3d" style={{top:230,'--z':'100px',animationDelay:'-4s',borderColor:'rgba(45,212,191,0.4)'}}>
              <div className="t"><span style={{display:'flex',alignItems:'center',gap:8}}><span className="lp-check"><Ic name="bolt" size={12} stroke={2.4}/></span>Password reset</span><span className="badge badge-resolved">Resolved</span></div>
              <div className="s">No agent needed · 4s</div>
            </div>
          </div>
        </div>
        <div className="auth-quote">Routine IT requests, resolved in seconds — not hours.</div>
        <div className="auth-quote-sub">Automated L1 resolution for modern IT teams</div>
      </aside>

      <main className="auth-main">
        <div className="auth-main-top">
          <button className="btn btn-ghost btn-sm" onClick={goToLanding}><Ic name="arrowLeft" size={15}/>Back to home</button>
        </div>
        <div className="auth-wrap">
          <div className="auth-card">
            <div className="auth-title">{tab==='signup'?'Create your account':'Welcome back'}</div>
            <div className="auth-sub">{tab==='signup'?'Start your free trial — no card required.':'Sign in to your Ticktra workspace.'}</div>

            <div className="seg">
              {['signup','signin'].map(t=>(
                <div key={t} className={tab===t?'on':''} onClick={()=>{setTab(t);setErrors({});}}>{t==='signup'?'Sign up':'Sign in'}</div>
              ))}
            </div>

            {tab==='signup' && (
              <div className="form-group">
                <label className="label">Full name</label>
                <input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} onKeyDown={onEnter} placeholder="Your name"/>
                {errors.name&&<div className="field-error">{errors.name}</div>}
              </div>
            )}
            <div className="form-group">
              <label className="label">Work email</label>
              <input className="input" type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} onKeyDown={onEnter} placeholder="name@company.co.uk"/>
              {errors.email&&<div className="field-error">{errors.email}</div>}
            </div>
            {tab==='signup' && (
              <div className="form-group">
                <label className="label">Company name</label>
                <input className="input" value={form.company} onChange={e=>setForm({...form,company:e.target.value})} onKeyDown={onEnter} placeholder="Acme Corp"/>
              </div>
            )}
            <div className="form-group" style={{marginBottom:tab==='signin'?6:20}}>
              <label className="label">Password</label>
              <input className="input" type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} onKeyDown={onEnter} placeholder={tab==='signup'?'Min 6 characters':'Your password'}/>
              {errors.password&&<div className="field-error">{errors.password}</div>}
            </div>
            {tab==='signin'&&<div style={{textAlign:'right',marginBottom:18}}><span className="link" style={{fontSize:12.5}}>Forgot password?</span></div>}

            <button className="btn btn-primary btn-lg w-full" onClick={handleSubmit} disabled={submitting}>
              {submitting ? 'Please wait…' : (tab==='signup'?'Create account':'Sign in')}
              {!submitting && <Ic name="arrow" size={16} stroke={2.2}/>}
            </button>

            <div className="or-row">or</div>

            <button className="btn btn-secondary w-full" style={{padding:'11px 16px'}} onClick={goToApp}>
              <svg width="18" height="18" viewBox="0 0 21 21"><rect x="0" y="0" width="10" height="10" fill="#F25022"/><rect x="11" y="0" width="10" height="10" fill="#7FBA00"/><rect x="0" y="11" width="10" height="10" fill="#00A4EF"/><rect x="11" y="11" width="10" height="10" fill="#FFB900"/></svg>
              Continue with Microsoft
            </button>

            <div style={{textAlign:'center',marginTop:22,fontSize:13,color:'var(--text-muted)'}}>
              {tab==='signup'?<>Already have an account? <span onClick={()=>setTab('signin')} className="link">Sign in</span></>:<>Don't have an account? <span onClick={()=>setTab('signup')} className="link">Sign up free</span></>}
            </div>
          </div>
        </div>
      </main>
    </div>
  );
}



// ── ROOT ──────────────────────────────────────────────────────────────────────
function Root() {
  const [screen, setScreen] = useState('landing');
  const [authTab, setAuthTab] = useState('signup');

  const goToAuth = (tab='signup') => { setAuthTab(tab); setScreen('auth'); window.scrollTo(0,0); };
  const goToApp = () => setScreen('app');
  const goToLanding = () => { setScreen('landing'); window.scrollTo(0,0); };

  if(screen==='landing') return <Landing goToAuth={goToAuth}/>;
  if(screen==='auth') return <Auth defaultTab={authTab} goToApp={goToApp} goToLanding={goToLanding}/>;
  return <AppWithSignOut goToLanding={goToLanding}/>;
}

// ── APP SHELL ─────────────────────────────────────────────────────────────────
function AppWithSignOut({goToLanding}) {
  const defaultRole = (CURRENT_USER && CURRENT_USER.role) || 'End User';
  const [role, setRole] = useState(defaultRole);
  const [activePage, setActivePage] = useState(NAV[defaultRole][0].id);
  const [roleMenuOpen, setRoleMenuOpen] = useState(false);
  const [selectedTicket, setSelectedTicket] = useState(null);
  const menuRef = useRef(null);

  const handleRoleChange = (r) => { setRole(r); setRoleMenuOpen(false); setActivePage(NAV[r][0].id); };

  useEffect(()=>{
    const h = (e) => { if(menuRef.current&&!menuRef.current.contains(e.target)) setRoleMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  },[]);

  const renderPage = () => {
    switch(activePage) {
      case 'portal': return <TicketPortal setActivePage={setActivePage}/>;
      case 'kb': return <KnowledgeBase/>;
      case 'account': return <AccountProfile/>;
      case 'agent-dashboard': return <AgentDashboard setActivePage={setActivePage} setSelectedTicket={setSelectedTicket}/>;
      case 'agent-inbox': return <AgentInbox setActivePage={setActivePage} setSelectedTicket={setSelectedTicket}/>;
      case 'agent-ticket': return <AgentTicketView ticketId={selectedTicket||TICKETS[0].id} setActivePage={setActivePage}/>;
      case 'agent-kb': return <KnowledgeHub/>;
      case 'admin-analytics': return <AnalyticsDashboard/>;
      case 'admin-users': return <UserManagement/>;
      case 'admin-integrations': return <Integrations/>;
      case 'admin-settings': return <AdminSettings/>;
      default: return <EmptyState icon="sparkle" title="Coming soon" sub="This page is on the way." />;
    }
  };

  const isFullPage = activePage === 'agent-ticket';
  const signOut = () => api('/api/auth/logout',{method:'POST'}).finally(goToLanding);

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          <Logo/>
          <span className="logo-text">Ticktra</span>
        </div>
        <div className="sidebar-role-label">{role}</div>
        <nav className="sidebar-nav">
          {NAV[role].map(item=>{
            const isActive = activePage === item.id || (item.id === 'agent-inbox' && activePage === 'agent-ticket');
            return (
              <div key={item.id} className={`nav-item ${isActive?'active':''}`} onClick={()=>setActivePage(item.id)} title={item.label}>
                <span className="icon">{item.icon}</span>
                <span>{item.label}</span>
              </div>
            );
          })}
        </nav>
        <div className="sidebar-foot">
          <div className="user-chip">
            <div className="avatar" style={{borderRadius:10}}>{CURRENT_USER ? initials(CURRENT_USER.name) : '?'}</div>
            <div className="user-chip-info">
              <div className="user-chip-name">{CURRENT_USER ? CURRENT_USER.name : 'Guest'}</div>
              <div className="user-chip-mail">{CURRENT_USER ? CURRENT_USER.email : 'Demo mode'}</div>
            </div>
            <button className="icon-btn" onClick={signOut} title="Sign out"><Ic name="logout" size={16}/></button>
          </div>
        </div>
      </aside>
      <div className="main-wrap">
        <header className="topbar">
          <div className="topbar-title">
            <div className="topbar-crumb">Ticktra / {role}</div>
            <div className="topbar-heading">{PAGE_TITLES[activePage]||''}</div>
          </div>
          <div className="role-switcher" onClick={()=>setRoleMenuOpen(o=>!o)} ref={menuRef}>
            <div className="role-dot" style={{background:ROLE_COLORS[role],color:ROLE_COLORS[role]}}/>
            {role}
            <span style={{fontSize:10,opacity:0.5}}>▾</span>
            {roleMenuOpen&&(
              <div className="role-menu">
                <div style={{padding:'8px 12px 6px',fontSize:10.5,fontWeight:700,color:'var(--text-light)',textTransform:'uppercase',letterSpacing:'1px'}}>Switch role</div>
                {Object.keys(NAV).map(r=>(
                  <div key={r} className={`role-menu-item ${role===r?'selected':''}`} onClick={(e)=>{e.stopPropagation();handleRoleChange(r);}}>
                    <div className="role-dot" style={{background:ROLE_COLORS[r],color:ROLE_COLORS[r]}}/>
                    {r}
                    {role===r&&<span style={{marginLeft:'auto'}}><Ic name="check" size={14} stroke={2.4}/></span>}
                  </div>
                ))}
              </div>
            )}
          </div>
          {CURRENT_USER
            ? <div className="avatar" title={CURRENT_USER.name}>{initials(CURRENT_USER.name)}</div>
            : <div className="avatar" title="Account">?</div>
          }
        </header>
        {isFullPage ? renderPage() : <div className="page" key={activePage}><div className="page-inner">{renderPage()}</div></div>}
      </div>
      <ChatWidget/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);

</script>
<script>
  // Fetches the current data (tickets, KB articles, users, logged-in user)
  // from the Flask backend, then transpiles and runs the app source above
  // (kept as type="text/plain" so Babel doesn't auto-run it too early).
  fetch('/api/bootstrap')
    .then(r => r.json())
    .then(data => {
      window.__INITIAL__ = data;
      const source = document.getElementById('ticktra-app-source').textContent;
      const { code } = Babel.transform(source, { presets: [['react', { runtime: 'classic' }]] });
      const script = document.createElement('script');
      script.textContent = code;
      document.body.appendChild(script);
    })
    .catch(err => {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;font-family:sans-serif;color:#F87171;background:#060A13;min-height:100vh">Failed to load Ticktra: ' + err.message + '</div>';
    });
</script>
