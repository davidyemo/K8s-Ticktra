apiVersion: argoproj.iov1alpha1
kind: Application
metadata:
  name: ticktra-flask
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/davidyemo/K8s-Ticktra.git
    targetRevision: main
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: ticktra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true