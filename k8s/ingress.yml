apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticktra-flask
spec:
  ingressClassName: nginx
  rules:
  - host: app.ticktra.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ticktra-flask
            port:
              number: 80