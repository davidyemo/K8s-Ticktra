apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticktra-flask
  labels:
    app: ticktra-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticktra-flask
  template:
    metadata:
      labels:
        app: ticktra-flask
    spec:
      containers:
      - name: ticktra-flask-container
        image: ticktraregistry1.azurecr.io/ticktra-flask:0fa7c5127f288279736c50e8dc8317fdfda3f51f
        ports:
        - containerPort: 8000

