apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticktra-flask
  labels:
    app: ticktra-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticktra-flask
  template:
    metadata:
      labels:
        app: ticktra-flask
    spec:
      containers:
      - name: ticktra-flask-container
        image: ticktraregistry1.azurecr.io/ticktra-flask:0820e61b3d971598117e4ae4454d1cd51ae8e1c8
        ports:
        - containerPort: 8000

