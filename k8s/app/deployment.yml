apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticktra-flask
  labels:
    app: ticktra-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticktra-flask
  template:
    metadata:
      labels:
        app: ticktra-flask
    spec:
      containers:
      - name: ticktra-flask-container
        image: ticktraregistry1.azurecr.io/ticktra-flask:aecb26df56615a41555b09742304d85bf228f541
        ports:
        - containerPort: 8000

